name: Stars Refresh

# Manual only. Rewrites README star counts from the GitHub API and opens a PR.
# A schedule can be added later; it is left out on purpose until the maintainer chooses a cadence.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stars-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Rewrite star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-stars.py
      - name: Open a pull request when counts changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet README.md; then
            echo "No star counts changed."
            exit 0
          fi
          branch="chore/stars-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: refresh README star counts"
          git push --force-with-lease origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "chore: refresh README star counts" \
            --body "Generated by the Stars Refresh workflow from the GitHub API."
