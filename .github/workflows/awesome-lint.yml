name: Awesome Lint

# The Awesome badge is a claim; this keeps it honest (and is a hard gate for sindresorhus/awesome).
on:
  pull_request:
    paths: ["README.md", ".github/workflows/awesome-lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes awesome-lint
